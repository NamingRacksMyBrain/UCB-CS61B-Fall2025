<!DOCTYPE html>
<head>
    <script src="jquery.min.js"></script>
    <link rel="stylesheet" href="ngordnet.css">
    <script src="ngordnet.js"></script>
</head>

<html>
<body>

<p>
    <img src="blank.png" id="plot">
    <textarea class="textresult" id="textresult" style="width: 800px; height: 350px; font-family: monospace;"></textarea>
</p>

<table>
    <tr>
        <td>
            words<br>
            <input type="text" id="words"><br>
        </td>
        <td>
            start<br>
            <input type="text" id="start" value="1900"><br>
        </td>
        <td>
            end<br>
            <input type="text" id="end" value="2020"><br>
        </td>
        <td>
            k<br>
            <input type="text" id="k" value="5"><br>
        </td>
    </tr>
</table>
<table>
    <tr>
        <td><div class="btn" id="history">history</div></td>
        <td><div class="btn" id="historytext">history (text)</div></td>
        <td><div class="btn" id="hyponyms">hyponyms</div></td>
        <td><div class="btn" id="hypohist">hypohist</div></td>
        <td><div class="btn" id="hypohisttext">hypohist (text)</div></td>
        <td><div class="btn" id="commonancestors">common ancestors</div></td>
    </tr>
    <tr>
        <td><div class="btn" id="shortestpath" style="background-color: #2b7a78;">shortest path</div></td>
        <td><div class="btn" id="zipf" style="background-color: #3aafa9;">zipf's law</div></td>
        <td><div class="btn" id="wordlength" style="background-color: #3aafa9;">avg word length</div></td>
        <td><div class="btn" id="trending" style="background-color: #17252a;">trending words</div></td>
    </tr>
</table>

</body>
</html>
